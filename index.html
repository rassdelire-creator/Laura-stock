<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiroir à Idées 🚀</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>TIROIR À IDÉES <span>// v1.0</span></h1>
      <button id="themeToggle" class="icon-btn" title="Changer le thème">🌙</button>
    </header>

    <!-- Zone pour ajouter une nouvelle idée -->
    <section class="add-idea-section">
      <div class="input-group">
        <input type="text" id="ideaTitle" placeholder="Titre de ton idée..." autocomplete="off">
        <select id="ideaCategory">
          <option value="app">💻 App / Dev</option>
          <option value="story">✍️ Histoire</option>
          <option value="video">🎥 Vidéo</option>
          <option value="other">💡 Autre</option>
        </select>
      </div>
      <textarea id="ideaText" placeholder="Écris les détails de ton idée ici pour ne pas la perdre..." rows="3"></textarea>
      <button id="addBtn" class="primary-btn"><b>+</b> Sauvegarder l'idée</button>
    </section>

    <!-- Filtres et recherche -->
    <section class="filter-section">
      <input type="text" id="searchInput" placeholder="🔍 Rechercher dans mes idées...">
      <div class="tags">
        <button class="tag-btn active" data-filter="all">Toutes</button>
        <button class="tag-btn" data-filter="app">Dev</button>
        <button class="tag-btn" data-filter="story">Histoires</button>
        <button class="tag-btn" data-filter="video">Vidéos</button>
      </div>
    </section>

    <!-- Liste des idées rangées -->
    <main id="ideasList" class="ideas-grid">
      <!-- Les cartes d'idées apparaîtront ici -->
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
