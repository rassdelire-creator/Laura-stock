<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LaugraStok 🚀</title>
  
  <meta name="apple-mobile-web-app-title" content="LaugraStok">
  <meta name="application-name" content="LaugraStok">
  <meta name="theme-color" content="#090a0f">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Écran d'accueil (Splash Screen) -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-logo-box">
      <span class="splash-icon">🫶</span>
    </div>
    <h1 class="splash-title">LAUGRASTOK</h1>
  </div>

  <!-- Formulaire Profil Initial -->
  <div id="profileModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Bienvenue ! 🚀</h2>
      <p>Configure ton profil pour commencer :</p>
      
      <div class="form-group">
        <label>Ton prénom ou pseudo *</label>
        <input type="text" id="userNameInput" placeholder="Ex: Rayan">
      </div>

      <div class="form-group">
        <label>Ton âge *</label>
        <input type="number" id="userAgeInput" placeholder="Ex: 17">
      </div>

      <div class="form-group">
        <label>Genre / Pronoms *</label>
        <select id="userGenderInput">
          <option value="il">Homme (Il)</option>
          <option value="elle">Femme (Elle)</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nom de ton crush / âme sœur (Optionnel)</label>
        <input type="text" id="userCrushInput" placeholder="Prénom...">
      </div>

      <button id="saveProfileBtn" class="primary-btn">Valider et Entrer</button>
    </div>
  </div>

  <!-- COFFRE-FORT / IDÉES SECRÈTES (MODAL) -->
  <div id="secretModal" class="modal-overlay hidden">
    <div class="modal-card modal-large">
      <div class="modal-header">
        <h2>🔒 Idées Secrètes</h2>
        <button id="closeSecretBtn" class="close-btn">✕</button>
      </div>

      <!-- Étape 1 : Saisie ou Création du PIN -->
      <div id="pinArea">
        <p id="pinInstruction">Entre ton mot de passe à 6 chiffres :</p>
        <div class="pin-inputs">
          <input type="password" maxlength="6" id="pinInput" placeholder="••••••" inputmode="numeric">
        </div>
        <button id="unlockSecretBtn" class="primary-btn mt-12">Déverrouiller</button>
      </div>

      <!-- Étape 2 : Contenu du Coffre-fort -->
      <div id="secretContent" class="hidden">
        <p class="secret-desc">Ces idées ne sont visibles qu'avec ton code PIN.</p>
        
        <div class="apple-card add-idea-section compact">
          <input type="text" id="secretTitle" placeholder="Titre secret...">
          <textarea id="secretText" placeholder="Écris ton idée secrète..." rows="2"></textarea>
          <button id="addSecretBtn" class="primary-btn mt-12">🔒 Sauvegarder dans le coffre</button>
        </div>

        <div id="secretIdeasList" class="ideas-grid"></div>
      </div>
    </div>
  </div>

  <!-- MODAL MINI-JEUX -->
  <div id="gamesModal" class="modal-overlay hidden">
    <div class="modal-card modal-large">
      <div class="modal-header">
        <h2>🎮 Arcade Mini-Jeux</h2>
        <button id="closeGamesBtn" class="close-btn">✕</button>
      </div>

      <div class="games-tabs">
        <button class="game-tab-btn active" data-game="snake">🐍 Snake</button>
        <button class="game-tab-btn" data-game="tetris">🧱 Tetris</button>
        <button class="game-tab-btn" data-game="pacman">🟡 Pac-Man</button>
        <button class="game-tab-btn" data-game="sudoku">🔢 Sudoku</button>
      </div>

      <div class="game-display-area">
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <div id="sudokuGrid" class="sudoku-grid hidden"></div>
      </div>

      <div class="game-controls">
        <button id="startGameBtn" class="primary-btn">Démarrer la partie</button>
        <div id="mobileDpad" class="d-pad">
          <button id="btnUp">▲</button>
          <div class="d-pad-row">
            <button id="btnLeft">◄</button>
            <button id="btnDown">▼</button>
            <button id="btnRight">►</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENEUR PRINCIPAL -->
  <div class="app-container">
    <header>
      <div>
        <h1>LAUGRASTOK <span>v1.0</span></h1>
        <p id="userGreeting" class="user-greeting"></p>
      </div>
      
      <!-- ICÔNES EN HAUT À DROITE -->
      <div class="header-actions">
        <button id="secretToggle" class="icon-btn" title="Coffre-fort Idées Secrètes">🔒</button>
        <button id="gamesToggle" class="icon-btn" title="Mini-jeux">🎮</button>
        <button id="themeToggle" class="icon-btn" title="Changer le thème">🌙</button>
      </div>
    </header>

    <!-- CREATION D'IDÉE PUBLIQUE (AVEC AUDIO + PHOTO/VIDÉO) -->
    <section class="apple-card add-idea-section">
      <div class="input-group">
        <input type="text" id="ideaTitle" placeholder="Titre de ton idée..." autocomplete="off">
        <select id="ideaCategory">
          <option value="app">💻 Dev</option>
          <option value="story">✍️ Histoire</option>
          <option value="video">🎥 Vidéo</option>
          <option value="other">💡 Autre</option>
        </select>
      </div>

      <textarea id="ideaText" placeholder="Écris ton idée ici..." rows="3"></textarea>

      <!-- BARRE MÉDIA & VOCAL (STYLE WHATSAPP / APPLE) -->
      <div class="media-bar">
        <!-- Carré / Bulle Vocal -->
        <button id="recordVoiceBtn" class="media-btn voice-square" title="Enregistrer un vocal">
          <span class="mic-icon">🎙️</span>
          <span id="recordTimer" class="record-timer hidden">00:00</span>
        </button>

        <!-- Bouton Photo / Vidéo -->
        <label for="cameraInput" class="media-btn camera-square" title="Prendre une photo ou vidéo">
          📷 / 🎥
          <input type="file" id="cameraInput" accept="image/*,video/*" capture="environment" hidden>
        </label>

        <span id="mediaStatus" class="media-status-text">Aucun fichier média ajouté</span>
      </div>

      <button id="addBtn" class="primary-btn mt-12"><b>+</b> Sauvegarder l'idée</button>
    </section>

    <!-- RECHERCHE ET FILTRES -->
    <section class="filter-section">
      <input type="text" id="searchInput" placeholder="🔍 Rechercher dans mes idées...">
      <div class="tags">
        <button class="tag-btn active" data-filter="all">Toutes</button>
        <button class="tag-btn" data-filter="app">Dev</button>
        <button class="tag-btn" data-filter="story">Histoires</button>
        <button class="tag-btn" data-filter="video">Vidéos</button>
      </div>
    </section>

    <!-- LISTE DES IDÉES -->
    <main id="ideasList" class="ideas-grid"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
