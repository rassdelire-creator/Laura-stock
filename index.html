<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LaugraStok 🚀</title>
  
  <meta name="apple-mobile-web-app-title" content="LaugraStok">
  <meta name="application-name" content="LaugraStok">
  <meta name="theme-color" content="#090a0f">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Écran d'accueil (Splash Screen) -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-logo-box">
      <span class="splash-icon">🫶</span>
    </div>
    <h1 class="splash-title">LAUGRASTOK</h1>
  </div>

  <!-- Formulaire Profil Style Apple Centré -->
  <div id="profileModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Bienvenue ! 🚀</h2>
      <p>Configure ton profil pour commencer :</p>
      
      <div class="form-group">
        <label>Comment tu t'appelles ? *</label>
        <input type="text" id="userNameInput" placeholder="Ton prénom ou pseudo">
      </div>

      <div class="form-group">
        <label>Ton âge *</label>
        <input type="number" id="userAgeInput" placeholder="Ex: 17">
      </div>

      <div class="form-group">
        <label>Genre / Pronoms *</label>
        <select id="userGenderInput">
          <option value="il">Homme (Il)</option>
          <option value="elle">Femme (Elle)</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nom de ton âme sœur ou crush (Optionnel)</label>
        <input type="text" id="userCrushInput" placeholder="Prénom de ton crush...">
      </div>

      <button id="saveProfileBtn" class="primary-btn">Valider et Entrer</button>
    </div>
  </div>

  <div class="app-container">
    <header>
      <div>
        <h1>LAUGRASTOK <span>v1.0</span></h1>
        <p id="userGreeting" class="user-greeting"></p>
      </div>
      <button id="themeToggle" class="icon-btn" title="Changer le thème">🌙</button>
    </header>

    <!-- MINI-JEU GEOMETRY DASH -->
    <section class="apple-card game-section">
      <div class="game-header">
        <h3>🎮 Mini Geometry Dash</h3>
        <span id="gameScore">Score: 0</span>
      </div>
      <div id="gameContainer" class="game-container">
        <div id="player" class="player"></div>
        <div id="obstacle" class="obstacle"></div>
        <div id="startScreen" class="game-start-overlay">
          <button id="startGameBtn" class="primary-btn">Jouer / Sauter</button>
        </div>
      </div>
      <p class="game-hint">Touche l'écran pour sauter !</p>
    </section>

    <!-- SAUVEGARDE D'IDÉES + VOCAL APPLE STYLE -->
    <section class="apple-card add-idea-section">
      <div class="input-group">
        <input type="text" id="ideaTitle" placeholder="Titre de ton idée..." autocomplete="off">
        <select id="ideaCategory">
          <option value="app">💻 Dev</option>
          <option value="story">✍️ Histoire</option>
          <option value="video">🎥 Vidéo</option>
          <option value="other">💡 Autre</option>
        </select>
      </div>

      <textarea id="ideaText" placeholder="Écris ton idée ici..." rows="3"></textarea>

      <!-- BARRE ENREGISTREMENT VOCAL STYLE DICTAPHONE APPLE -->
      <div class="voice-recorder-bar">
        <button id="recordVoiceBtn" class="voice-btn">
          <span class="mic-icon">🎙️</span>
          <span id="recordStatus">Enregistrer une note vocale</span>
        </button>
        <span id="recordTimer" class="record-timer hidden">00:00</span>
      </div>

      <button id="addBtn" class="primary-btn mt-12"><b>+</b> Sauvegarder l'idée</button>
    </section>

    <section class="filter-section">
      <input type="text" id="searchInput" placeholder="🔍 Rechercher dans mes idées...">
      <div class="tags">
        <button class="tag-btn active" data-filter="all">Toutes</button>
        <button class="tag-btn" data-filter="app">Dev</button>
        <button class="tag-btn" data-filter="story">Histoires</button>
        <button class="tag-btn" data-filter="video">Vidéos</button>
      </div>
    </section>

    <main id="ideasList" class="ideas-grid">
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
